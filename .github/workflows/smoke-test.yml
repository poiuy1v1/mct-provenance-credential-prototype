name: End-to-end artifact validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Identify notebook kernel
        run: python -c "import ipykernel, sys; print(sys.executable); print(ipykernel.__version__)"
      - run: python scripts/run_smoke_tests.py --notebook-backend nbclient
